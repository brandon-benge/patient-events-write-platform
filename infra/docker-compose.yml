services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-events-write-platform-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: patient_events
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - synchronous_commit=off
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d patient_events"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1

  redis:
    image: redis:7-alpine
    container_name: patient-events-write-platform-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 0.25

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: patient-events-write-platform-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 768m
    cpus: 0.75

  kafka-connect:
    image: debezium/connect:2.5
    container_name: patient-events-write-platform-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_PLUGIN_PATH: /kafka/connect,/debezium-connector-postgres
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 768m
    cpus: 0.75

  topic-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: patient-events-write-platform-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka:/infra/kafka:ro
    command: ["bash", "/infra/kafka/scripts/create-topics.sh"]
    restart: "no"
    mem_limit: 96m
    cpus: 0.15

  connector-init:
    image: curlimages/curl:8.6.0
    container_name: patient-events-write-platform-connector-init
    depends_on:
      kafka-connect:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium:/infra/debezium:ro
    command: ["sh", "/infra/debezium/scripts/register-connectors.sh"]
    restart: "no"
    mem_limit: 64m
    cpus: 0.10


  flink-jobmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    container_name: patient-events-write-platform-flink-jm
    depends_on:
      api:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ./flink:/repo-flink:ro
    entrypoint: ["/repo-flink/flink-jobmanager-entrypoint.sh"]
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.advertised-address: flink-jobmanager
        parallelism.default: 4
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 100
        restart-strategy.fixed-delay.delay: 5s
        rest.port: 8081
        heartbeat.interval: 10000
        heartbeat.timeout: 120000
        jobmanager.memory.process.size: 1024m
        jobmanager.memory.jvm-metaspace.size: 256m
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: patient_events
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.00

  flink-taskmanager:
    build:
      context: .
      dockerfile: flink/Dockerfile
    container_name: patient-events-write-platform-flink-tm
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    volumes:
      - ./flink:/repo-flink:ro
    environment:
      DEBUG: ${DEBUG:-false}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 6
        parallelism.default: 4
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 100
        restart-strategy.fixed-delay.delay: 5s
        heartbeat.interval: 10000
        heartbeat.timeout: 120000
        taskmanager.memory.process.size: 4096m
        taskmanager.memory.jvm-metaspace.size: 256m
        taskmanager.memory.managed.size: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://flink-jobmanager:8081/taskmanagers 2>/dev/null | grep -q '\"id\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 5g
    cpus: 3.00


  flink-submit:
    build:
      context: .
      dockerfile: flink/Dockerfile
    container_name: patient-events-write-platform-flink-submit
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./flink:/repo-flink:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        echo "Submitting PyFlink job to JobManager...";
        /opt/flink/bin/flink run -m http://flink-jobmanager:8081 -p 6 -py /repo-flink/deid_projection_job.py
        echo "Submission complete.";
    restart: "no"
    mem_limit: 256m
    cpus: 0.25

  api:
    image: eclipse-temurin:21-jre
    container_name: patient-events-write-platform-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ../services:/app:rw
      - ./liquibase:/app/docs:ro
    command:
      - sh
      - -c
      - |
        JAR_PATH="$$(ls -1 target/*.jar 2>/dev/null | head -n 1)"
        if [ -n "$${JAR_PATH}" ]; then
          exec java -jar "$${JAR_PATH}";
        fi
        echo "No built jar found in ./services/target; run mvn package to build the API.";
        exec tail -f /dev/null
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patient_events
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_LIQUIBASE_CHANGE_LOG: file:/app/docs/liquibase.yaml
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=25
        -XX:MaxRAMPercentage=60
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q 'UP' ||
          wget -qO- http://localhost:8080/health 2>/dev/null >/dev/null ||
          pgrep -f 'java .*\.jar' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g
    cpus: 0.40

volumes:
  pg_data:
  redis_data:
